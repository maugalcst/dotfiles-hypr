source = ~/.config/hypr/hyprlock/colors.conf

background {
    monitor =
    path = $background_image
    blur_passes = 4
    blur_size = 7
    noise = 0.015
    contrast = 1.1
    brightness = 0.5
    vibrancy = 0.15
    vibrancy_darkness = 0.4
}

# ── Reloj ──────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 120
    font_family = $font_family_clock
    position = -80, 0
    halign = center
    valign = center
}

# ── Separador ──────────────────────────────────────────
label {
    monitor =
    text = ────────────────
    color = $text_dim
    font_size = 18
    font_family = $font_family
    position = -80, -90
    halign = center
    valign = center
}

# ── Fecha ──────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"  %A · %d %B"
    color = $text_dim
    font_size = 28
    font_family = $font_family
    position = -80, -122
    halign = center
    valign = center
}

# ── Input field ────────────────────────────────────────
input-field {
    monitor =
    size = 380, 60
    outline_thickness = 1
    dots_size = 0.15
    dots_spacing = 0.25
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_size = 18
    fade_on_empty = true
    placeholder_text = <span foreground="##71675c">passwd</span>
    position = -80, -230
    halign = center
    valign = center
}

# ── Prompt de usuario ──────────────────────────────────
label {
    monitor =
    text = › $USER
    color = $text_dim
    font_size = 22
    font_family = $font_family
    position = -80, -300
    halign = center
    valign = center
}

# ── Status — esquina top-left ─────────────────────────
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/hyprlock/status.sh
    color = $text_dim
    font_size = 22
    font_family = $font_family
    position = 60, -60
    halign = left
    valign = top
}

# ── Layout — esquina top-right ────────────────────────
label {
    monitor =
    text = $LAYOUT
    color = $text_dim
    font_size = 22
    font_family = $font_family
    position = -60, -60
    halign = right
    valign = top
}

# ── CapsLock — bajo el layout ─────────────────────────
label {
    monitor =
    text = cmd[update:250] ~/.config/hypr/hyprlock/check-capslock.sh
    color = rgba(d4907aFF)
    font_size = 22
    font_family = $font_family
    position = -60, -90
    halign = right
    valign = top
}

# ── Firma — bottom-right ──────────────────────────────
label {
    monitor =
    text = nous · hyprlock
    color = $text_dim
    font_size = 20
    font_family = $font_family
    position = -60, 50
    halign = right
    valign = bottom
}
