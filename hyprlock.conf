source = ~/.config/hypr/hyprlock/colors.conf

animations {
    enabled = true
    bezier = smooth, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 8, smooth
    animation = fadeOut, 1, 8, smooth
    animation = inputFieldDots, 1, 2, smooth
}


background {
    monitor =
    path = $background_image
    blur_passes = 4
    blur_size = 7
    noise = 0.015
    contrast = 1.1
    brightness = 0.35
    vibrancy = 0.15
    vibrancy_darkness = 0.4
}

# ── Reloj ──────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 120
    font_family = $font_family_clock
    position = -80, 0
    halign = center
    valign = center
}

# ── Fecha ──────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"  %A · %d %B"
    color = $text_dim
    font_size = 28
    font_family = $font_family
    position = -80, -122
    halign = center
    valign = center
}

# ── Input field ────────────────────────────────────────
input-field {
    monitor =
    size = 380, 60
    outline_thickness = 1
    dots_size = 0.15
    dots_spacing = 0.25
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_size = 18
    fade_on_empty = true
    placeholder_text = <span foreground="##71675c">passwd</span>
    position = -80, -230
    halign = center
    valign = center
}

# ── Firma (mau@nous) — bajo el input ──────────────────
label {
    monitor =
    text = mau@nous
    color = $text_dim
    font_size = 22
    font_family = $font_family
    position = -80, -300
    halign = center
    valign = center
}


# ── CapsLock — esquina top-right ──────────────────────
label {
    monitor =
    text = cmd[update:250] ~/.config/hypr/hyprlock/check-capslock.sh
    color = rgba(d4907aFF)
    font_size = 22
    font_family = $font_family
    position = -60, -60
    halign = right
    valign = top
}

# ── Sistema (key:value) — inferior izquierda ──────────
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/sysinfo.sh
    color = $text_dim
    font_size = 18
    font_family = $font_family
    position = 60, 60
    halign = left
    valign = bottom
}

# ── Estado (key:value) — inferior derecha ─────────────
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/status.sh
    color = $text_dim
    font_size = 18
    font_family = $font_family
    position = 60, 220
    halign = left
    valign = bottom
}
